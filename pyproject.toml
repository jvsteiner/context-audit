[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-audit"
version = "0.1.0"
description = "Understand the files, tools, hooks, and usage that shape your coding agent's context."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["tiktoken>=0.8,<1", "PyYAML>=6,<7", "tomlkit>=0.13,<1"]

[project.scripts]
context-audit = "context_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/context_audit"]
